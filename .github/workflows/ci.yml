# Minimal pull-request checks (ARCHITECTURE §16.2): frozen-lockfile install,
# typecheck, unit tests, and the web build. No secrets, no deployment, and no
# device or browser tests. The pnpm version comes from `packageManager`.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm --filter @workspace/financial-clarity run test:run
      - name: Web build
        run: pnpm --filter @workspace/financial-clarity run build
