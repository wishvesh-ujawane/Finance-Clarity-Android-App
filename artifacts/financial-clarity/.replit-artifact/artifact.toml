kind = "web"
previewPath = "/"
title = "Financial Clarity"
version = "1.0.0"
id = "artifacts/financial-clarity"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24436

[services.development]
run = "pnpm --filter @workspace/financial-clarity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/financial-clarity", "run", "build" ]
publicDir = "artifacts/financial-clarity/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24436"
BASE_PATH = "/"
